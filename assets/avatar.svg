<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="180" height="180" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F472B6"/>
      <stop offset="25%" style="stop-color:#A855F7"/>
      <stop offset="50%" style="stop-color:#67E8F9"/>
      <stop offset="75%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#F472B6"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#A855F7;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#A855F7;stop-opacity:0"/>
    </radialGradient>
    <clipPath id="circleClip">
      <circle cx="90" cy="90" r="70"/>
    </clipPath>
    <filter id="avatarGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer glow -->
  <circle cx="90" cy="90" r="88" fill="url(#glowGrad)">
    <animate attributeName="r" values="85;92;85" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Animated rotating dashed ring -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 90 90" to="360 90 90" dur="8s" repeatCount="indefinite"/>
    <circle cx="90" cy="90" r="82" fill="none" stroke="url(#ringGrad)" stroke-width="3" stroke-dasharray="30 8 15 8" filter="url(#avatarGlow)"/>
  </g>
  
  <!-- Static inner ring -->
  <circle cx="90" cy="90" r="76" fill="none" stroke="#21262d" stroke-width="2"/>
  
  <!-- Profile picture -->
  <image xlink:href="profile.png" href="profile.png" x="20" y="20" width="140" height="140" clip-path="circleClip" preserveAspectRatio="xMidYMid slice"/>
  
  <!-- Subtle pulse on the photo -->
  <circle cx="90" cy="90" r="70" fill="none" stroke="#A855F7" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="70;72;70" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
