<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="180" height="180" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F472B6"/>
      <stop offset="100%" style="stop-color:#A855F7"/>
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="90" cy="90" r="76"/>
    </clipPath>
    <filter id="avatarShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer ring with gradient -->
  <circle cx="90" cy="90" r="86" fill="none" stroke="url(#ringGrad)" stroke-width="4"/>
  
  <!-- Profile picture with proper aspect ratio -->
  <image xlink:href="https://avatars.githubusercontent.com/u/161148557?v=4" x="14" y="14" width="152" height="152" clip-path="circleClip" preserveAspectRatio="xMidYMid slice"/>
</svg>
