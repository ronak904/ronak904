<svg xmlns="http://www.w3.org/2000/svg" width="860" height="220" viewBox="0 0 860 220">
  <defs>
    <linearGradient id="statsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="statsAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#67E8F9"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
    <filter id="statGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="statShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <rect width="860" height="220" rx="12" fill="url(#statsBg)"/>
  
  <text x="40" y="45" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#F0F6FC">GitHub Analytics</text>
  <rect x="40" y="55" width="50" height="3" rx="1.5" fill="url(#statsAccent)"/>
  
  <!-- Stat Card 1: Repositories -->
  <g transform="translate(40, 75)">
    <rect width="180" height="120" rx="12" fill="#21262d" stroke="#30363d" filter="url(#statShadow)"/>
    <rect width="180" height="4" rx="2" fill="#67E8F9"/>
    <text x="90" y="50" text-anchor="middle" font-family="'Consolas', monospace" font-size="36" font-weight="700" fill="#67E8F9" filter="url(#statGlow)">
      <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
      7
    </text>
    <text x="90" y="78" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Repositories</text>
    <line x1="30" y1="92" x2="150" y2="92" stroke="#30363d" stroke-width="1"/>
    <text x="90" y="112" text-anchor="middle" font-family="'Consolas', monospace" font-size="11" fill="#3fb950">All public</text>
  </g>
  
  <!-- Stat Card 2: Languages -->
  <g transform="translate(240, 75)">
    <rect width="180" height="120" rx="12" fill="#21262d" stroke="#30363d" filter="url(#statShadow)"/>
    <rect width="180" height="4" rx="2" fill="#a855f7"/>
    <text x="90" y="50" text-anchor="middle" font-family="'Consolas', monospace" font-size="36" font-weight="700" fill="#a855f7" filter="url(#statGlow)">
      <animate attributeName="opacity" values="1;0.6;1" dur="2s" begin="0.3s" repeatCount="indefinite"/>
      2
    </text>
    <text x="90" y="78" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Languages</text>
    <line x1="30" y1="92" x2="150" y2="92" stroke="#30363d" stroke-width="1"/>
    <text x="90" y="112" text-anchor="middle" font-family="'Consolas', monospace" font-size="11" fill="#3B82F6">JS · Java</text>
  </g>
  
  <!-- Stat Card 3: Coding Since -->
  <g transform="translate(440, 75)">
    <rect width="180" height="120" rx="12" fill="#21262d" stroke="#30363d" filter="url(#statShadow)"/>
    <rect width="180" height="4" rx="2" fill="#3fb950"/>
    <text x="90" y="50" text-anchor="middle" font-family="'Consolas', monospace" font-size="36" font-weight="700" fill="#3fb950" filter="url(#statGlow)">
      <animate attributeName="opacity" values="1;0.6;1" dur="2s" begin="0.6s" repeatCount="indefinite"/>
      2024
    </text>
    <text x="90" y="78" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Coding Since</text>
    <line x1="30" y1="92" x2="150" y2="92" stroke="#30363d" stroke-width="1"/>
    <text x="90" y="112" text-anchor="middle" font-family="'Consolas', monospace" font-size="11" fill="#3fb950">Learning in public</text>
  </g>
  
  <!-- Stat Card 4: Status -->
  <g transform="translate(640, 75)">
    <rect width="180" height="120" rx="12" fill="#21262d" stroke="#30363d" filter="url(#statShadow)"/>
    <rect width="180" height="4" rx="2" fill="#d29922"/>
    <text x="90" y="50" text-anchor="middle" font-family="'Consolas', monospace" font-size="28" font-weight="700" fill="#d29922" filter="url(#statGlow)">
      <animate attributeName="opacity" values="1;0.6;1" dur="2s" begin="0.9s" repeatCount="indefinite"/>
      Active
    </text>
    <text x="90" y="78" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Status</text>
    <line x1="30" y1="92" x2="150" y2="92" stroke="#30363d" stroke-width="1"/>
    <text x="90" y="112" text-anchor="middle" font-family="'Consolas', monospace" font-size="11" fill="#3fb950">Building daily</text>
  </g>
  
  <!-- Live indicator -->
  <circle cx="822" cy="45" r="4" fill="#3fb950">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="832" y="49" font-family="'Consolas', monospace" font-size="11" fill="#3fb950">Live</text>
</svg>
