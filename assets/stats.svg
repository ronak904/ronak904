<svg xmlns="http://www.w3.org/2000/svg" width="860" height="200" viewBox="0 0 860 200">
  <defs>
    <linearGradient id="statsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="statsAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#67E8F9"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="860" height="200" rx="12" fill="url(#statsBg)"/>
  
  <!-- Header -->
  <text x="40" y="45" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#F0F6FC">GitHub Analytics</text>
  <rect x="40" y="55" width="50" height="3" rx="1.5" fill="url(#statsAccent)"/>
  
  <!-- Stats Cards -->
  <g transform="translate(40, 75)">
    <rect width="180" height="100" rx="10" fill="#21262d" stroke="#30363d"/>
    <text x="90" y="35" text-anchor="middle" font-family="'Consolas', monospace" font-size="28" font-weight="700" fill="#67E8F9">7</text>
    <text x="90" y="60" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#8b949e">Repositories</text>
    <text x="90" y="85" text-anchor="middle" font-family="'Consolas', monospace" font-size="11" fill="#3fb950">All public</text>
  </g>
  
  <g transform="translate(240, 75)">
    <rect width="180" height="100" rx="10" fill="#21262d" stroke="#30363d"/>
    <text x="90" y="35" text-anchor="middle" font-family="'Consolas', monospace" font-size="28" font-weight="700" fill="#F0F6FC">2</text>
    <text x="90" y="60" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#8b949e">Languages</text>
    <text x="90" y="85" text-anchor="middle" font-family="'Consolas', monospace" font-size="11" fill="#3B82F6">JS · Java</text>
  </g>
  
  <g transform="translate(440, 75)">
    <rect width="180" height="100" rx="10" fill="#21262d" stroke="#30363d"/>
    <text x="90" y="35" text-anchor="middle" font-family="'Consolas', monospace" font-size="28" font-weight="700" fill="#3fb950">2024</text>
    <text x="90" y="60" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#8b949e">Coding Since</text>
    <text x="90" y="85" text-anchor="middle" font-family="'Consolas', monospace" font-size="11" fill="#3fb950">Learning in public</text>
  </g>
  
  <g transform="translate(640, 75)">
    <rect width="180" height="100" rx="10" fill="#21262d" stroke="#30363d"/>
    <text x="90" y="35" text-anchor="middle" font-family="'Consolas', monospace" font-size="28" font-weight="700" fill="#d29922">Active</text>
    <text x="90" y="60" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#8b949e">Status</text>
    <text x="90" y="85" text-anchor="middle" font-family="'Consolas', monospace" font-size="11" fill="#3fb950">Building daily</text>
  </g>
</svg>
