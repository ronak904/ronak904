<svg xmlns="http://www.w3.org/2000/svg" width="860" height="200" viewBox="0 0 860 200">
  <defs>
    <linearGradient id="statsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="statsAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#67E8F9"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
    <filter id="statGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="860" height="200" rx="12" fill="url(#statsBg)"/>
  
  <text x="40" y="45" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#F0F6FC">GitHub Analytics</text>
  <rect x="40" y="55" width="50" height="3" rx="1.5" fill="url(#statsAccent)"/>
  
  <!-- Stat Card 1: Repositories -->
  <g transform="translate(40, 75)">
    <rect width="180" height="100" rx="10" fill="#21262d" stroke="#30363d"/>
    <rect width="180" height="3" rx="1.5" fill="#67E8F9"/>
    <text x="90" y="45" text-anchor="middle" font-family="'Consolas', monospace" font-size="32" font-weight="700" fill="#67E8F9" filter="url(#statGlow)">
      <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
      7
    </text>
    <text x="90" y="72" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#8b949e">Repositories</text>
    <text x="90" y="92" text-anchor="middle" font-family="'Consolas', monospace" font-size="11" fill="#3fb950">All public</text>
  </g>
  
  <!-- Stat Card 2: Languages -->
  <g transform="translate(240, 75)">
    <rect width="180" height="100" rx="10" fill="#21262d" stroke="#30363d"/>
    <rect width="180" height="3" rx="1.5" fill="#a855f7"/>
    <text x="90" y="45" text-anchor="middle" font-family="'Consolas', monospace" font-size="32" font-weight="700" fill="#a855f7" filter="url(#statGlow)">
      <animate attributeName="opacity" values="1;0.7;1" dur="2s" begin="0.3s" repeatCount="indefinite"/>
      2
    </text>
    <text x="90" y="72" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#8b949e">Languages</text>
    <text x="90" y="92" text-anchor="middle" font-family="'Consolas', monospace" font-size="11" fill="#3B82F6">JS · Java</text>
  </g>
  
  <!-- Stat Card 3: Coding Since -->
  <g transform="translate(440, 75)">
    <rect width="180" height="100" rx="10" fill="#21262d" stroke="#30363d"/>
    <rect width="180" height="3" rx="1.5" fill="#3fb950"/>
    <text x="90" y="45" text-anchor="middle" font-family="'Consolas', monospace" font-size="32" font-weight="700" fill="#3fb950" filter="url(#statGlow)">
      <animate attributeName="opacity" values="1;0.7;1" dur="2s" begin="0.6s" repeatCount="indefinite"/>
      2024
    </text>
    <text x="90" y="72" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#8b949e">Coding Since</text>
    <text x="90" y="92" text-anchor="middle" font-family="'Consolas', monospace" font-size="11" fill="#3fb950">Learning in public</text>
  </g>
  
  <!-- Stat Card 4: Status -->
  <g transform="translate(640, 75)">
    <rect width="180" height="100" rx="10" fill="#21262d" stroke="#30363d"/>
    <rect width="180" height="3" rx="1.5" fill="#d29922"/>
    <text x="90" y="45" text-anchor="middle" font-family="'Consolas', monospace" font-size="28" font-weight="700" fill="#d29922" filter="url(#statGlow)">
      <animate attributeName="opacity" values="1;0.7;1" dur="2s" begin="0.9s" repeatCount="indefinite"/>
      Active
    </text>
    <text x="90" y="72" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#8b949e">Status</text>
    <text x="90" y="92" text-anchor="middle" font-family="'Consolas', monospace" font-size="11" fill="#3fb950">Building daily</text>
  </g>
</svg>
