<svg xmlns="http://www.w3.org/2000/svg" width="860" height="260" viewBox="0 0 860 260">
  <defs>
    <linearGradient id="langBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="jsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f7df1e"/>
      <stop offset="100%" style="stop-color:#e3b341"/>
    </linearGradient>
    <linearGradient id="javaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#b07219"/>
      <stop offset="100%" style="stop-color:#e76f00"/>
    </linearGradient>
    <linearGradient id="otherGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b949e"/>
      <stop offset="100%" style="stop-color:#6e7681"/>
    </linearGradient>
    <filter id="cardGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="barShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <rect width="860" height="260" rx="12" fill="url(#langBg)"/>
  
  <!-- Header -->
  <text x="40" y="42" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#F0F6FC">Most-Used Languages</text>
  <text x="40" y="62" font-family="'Segoe UI', sans-serif" font-size="12" fill="#8b949e">Real byte count across all public repos</text>
  
  <!-- Language Card 1: JavaScript -->
  <g transform="translate(40, 80)">
    <rect width="240" height="150" rx="12" fill="#21262d" stroke="#30363d" filter="url(#barShadow)">
      <animate attributeName="stroke" values="#30363d;#f7df1e;#30363d" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect width="240" height="4" rx="2" fill="url(#jsGrad)"/>
    <circle cx="40" cy="45" r="18" fill="#f7df1e" opacity="0.15"/>
    <text x="40" y="51" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#f7df1e">JS</text>
    <text x="70" y="50" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#F0F6FC">JavaScript</text>
    <text x="70" y="70" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8b949e">Primary language</text>
    
    <!-- Progress bar background -->
    <rect x="20" y="95" width="200" height="8" rx="4" fill="#0d1117"/>
    <!-- Animated progress bar -->
    <rect x="20" y="95" width="0" height="8" rx="4" fill="url(#jsGrad)" filter="url(#cardGlow)">
      <animate attributeName="width" values="0;180" dur="1.5s" fill="freeze"/>
    </rect>
    <text x="20" y="125" font-family="'Consolas', monospace" font-size="20" font-weight="700" fill="#f7df1e">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1s" fill="freeze"/>
      ~55%
    </text>
    <text x="220" y="125" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8b949e">Frontend &amp; Backend</text>
    
    <!-- Floating indicator -->
    <circle cx="200" cy="99" r="3" fill="#f7df1e" filter="url(#cardGlow)">
      <animate attributeName="cx" values="20;200" dur="1.5s" fill="freeze"/>
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.1;1" dur="1.5s" fill="freeze"/>
    </circle>
  </g>
  
  <!-- Language Card 2: Java -->
  <g transform="translate(310, 80)">
    <rect width="240" height="150" rx="12" fill="#21262d" stroke="#30363d" filter="url(#barShadow)">
      <animate attributeName="stroke" values="#30363d;#b07219;#30363d" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
    <rect width="240" height="4" rx="2" fill="url(#javaGrad)"/>
    <circle cx="40" cy="45" r="18" fill="#b07219" opacity="0.15"/>
    <text x="40" y="51" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#b07219">Jv</text>
    <text x="70" y="50" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#F0F6FC">Java</text>
    <text x="70" y="70" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8b949e">Backend &amp; Microservices</text>
    
    <rect x="20" y="95" width="200" height="8" rx="4" fill="#0d1117"/>
    <rect x="20" y="95" width="0" height="8" rx="4" fill="url(#javaGrad)" filter="url(#cardGlow)">
      <animate attributeName="width" values="0;140" dur="1.5s" begin="0.3s" fill="freeze"/>
    </rect>
    <text x="20" y="125" font-family="'Consolas', monospace" font-size="20" font-weight="700" fill="#b07219">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.2s" fill="freeze"/>
      ~35%
    </text>
    <text x="220" y="125" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8b949e">Spring Boot</text>
    
    <circle cx="160" cy="99" r="3" fill="#b07219" filter="url(#cardGlow)">
      <animate attributeName="cx" values="20;160" dur="1.5s" begin="0.3s" fill="freeze"/>
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.1;1" dur="1.5s" begin="0.3s" fill="freeze"/>
    </circle>
  </g>
  
  <!-- Language Card 3: Other -->
  <g transform="translate(580, 80)">
    <rect width="240" height="150" rx="12" fill="#21262d" stroke="#30363d" filter="url(#barShadow)">
      <animate attributeName="stroke" values="#30363d;#8b949e;#30363d" dur="3s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <rect width="240" height="4" rx="2" fill="url(#otherGrad)"/>
    <circle cx="40" cy="45" r="18" fill="#8b949e" opacity="0.15"/>
    <text x="40" y="51" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#8b949e">Ot</text>
    <text x="70" y="50" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#F0F6FC">Other</text>
    <text x="70" y="70" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8b949e">HTML, CSS, Markdown</text>
    
    <rect x="20" y="95" width="200" height="8" rx="4" fill="#0d1117"/>
    <rect x="20" y="95" width="0" height="8" rx="4" fill="url(#otherGrad)" filter="url(#cardGlow)">
      <animate attributeName="width" values="0;60" dur="1.5s" begin="0.6s" fill="freeze"/>
    </rect>
    <text x="20" y="125" font-family="'Consolas', monospace" font-size="20" font-weight="700" fill="#8b949e">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.4s" fill="freeze"/>
      ~10%
    </text>
    <text x="220" y="125" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8b949e">Supporting</text>
    
    <circle cx="80" cy="99" r="3" fill="#8b949e" filter="url(#cardGlow)">
      <animate attributeName="cx" values="20;80" dur="1.5s" begin="0.6s" fill="freeze"/>
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.1;1" dur="1.5s" begin="0.6s" fill="freeze"/>
    </circle>
  </g>
  
  <!-- Live indicator -->
  <circle cx="782" cy="52" r="4" fill="#3fb950">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="794" y="56" font-family="'Consolas', monospace" font-size="11" fill="#3fb950">Live</text>
</svg>
