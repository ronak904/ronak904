<svg xmlns="http://www.w3.org/2000/svg" width="860" height="320" viewBox="0 0 860 320">
  <defs>
    <linearGradient id="eduBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="eduAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#67E8F9"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="860" height="320" rx="12" fill="url(#eduBg)"/>
  
  <!-- Header -->
  <text x="40" y="50" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#F0F6FC">Education & Learning Journey</text>
  <rect x="40" y="62" width="60" height="3" rx="1.5" fill="url(#eduAccent)"/>
  
  <!-- Card 1: Sigma Web Dev Course -->
  <g filter="url(#cardShadow)">
    <rect x="40" y="85" width="240" height="200" rx="10" fill="#21262d" stroke="#30363d"/>
  </g>
  <rect x="40" y="85" width="240" height="4" rx="2" fill="#67E8F9"/>
  <circle cx="70" cy="120" r="16" fill="#67E8F9" opacity="0.15"/>
  <text x="70" y="125" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#67E8F9">SW</text>
  <text x="95" y="125" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#F0F6FC">Sigma Web Dev</text>
  <text x="95" y="145" font-family="'Segoe UI', sans-serif" font-size="12" fill="#8b949e">Complete Course</text>
  <text x="55" y="175" font-family="'Segoe UI', sans-serif" font-size="12" fill="#c9d1d9">• HTML, CSS, JavaScript</text>
  <text x="55" y="195" font-family="'Segoe UI', sans-serif" font-size="12" fill="#c9d1d9">• React, Node.js, Databases</text>
  <text x="55" y="215" font-family="'Segoe UI', sans-serif" font-size="12" fill="#c9d1d9">• Full-stack projects</text>
  <text x="55" y="235" font-family="'Segoe UI', sans-serif" font-size="12" fill="#c9d1d9">• Deployment & DevOps basics</text>
  <text x="55" y="265" font-family="'Consolas', monospace" font-size="11" fill="#3fb950">Completed 2024</text>
  
  <!-- Card 2: YouTube Channel -->
  <g filter="url(#cardShadow)">
    <rect x="310" y="85" width="240" height="200" rx="10" fill="#21262d" stroke="#30363d"/>
  </g>
  <rect x="310" y="85" width="240" height="4" rx="2" fill="#FF0000"/>
  <circle cx="340" cy="120" r="16" fill="#FF0000" opacity="0.15"/>
  <text x="340" y="125" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#FF0000">YT</text>
  <text x="365" y="125" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#F0F6FC">B2 Mandal Channel</text>
  <text x="365" y="145" font-family="'Segoe UI', sans-serif" font-size="12" fill="#8b949e">YouTube Educator</text>
  <text x="325" y="175" font-family="'Segoe UI', sans-serif" font-size="12" fill="#c9d1d9">• JavaScript tutorials</text>
  <text x="325" y="195" font-family="'Segoe UI', sans-serif" font-size="12" fill="#c9d1d9">• Hindi + English content</text>
  <text x="325" y="215" font-family="'Segoe UI', sans-serif" font-size="12" fill="#c9d1d9">• Code-along sessions</text>
  <text x="325" y="235" font-family="'Segoe UI', sans-serif" font-size="12" fill="#c9d1d9">• Beginner-friendly</text>
  <text x="325" y="265" font-family="'Consolas', monospace" font-size="11" fill="#3fb950">Active 2024 — Present</text>
  
  <!-- Card 3: CS Fundamentals -->
  <g filter="url(#cardShadow)">
    <rect x="580" y="85" width="240" height="200" rx="10" fill="#21262d" stroke="#30363d"/>
  </g>
  <rect x="580" y="85" width="240" height="4" rx="2" fill="#3B82F6"/>
  <circle cx="610" cy="120" r="16" fill="#3B82F6" opacity="0.15"/>
  <text x="610" y="125" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#3B82F6">CS</text>
  <text x="635" y="125" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#F0F6FC">CS Fundamentals</text>
  <text x="635" y="145" font-family="'Segoe UI', sans-serif" font-size="12" fill="#8b949e">Self-Taught + Courses</text>
  <text x="595" y="175" font-family="'Segoe UI', sans-serif" font-size="12" fill="#c9d1d9">• Data structures</text>
  <text x="595" y="195" font-family="'Segoe UI', sans-serif" font-size="12" fill="#c9d1d9">• Algorithms</text>
  <text x="595" y="215" font-family="'Segoe UI', sans-serif" font-size="12" fill="#c9d1d9">• Software development</text>
  <text x="595" y="235" font-family="'Segoe UI', sans-serif" font-size="12" fill="#c9d1d9">• System design basics</text>
  <text x="595" y="265" font-family="'Consolas', monospace" font-size="11" fill="#3fb950">Ongoing</text>
</svg>
